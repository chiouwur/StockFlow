server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # solo para el PMV; en producción usa migraciones (Flyway/Liquibase)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  events:
    publisher: ${EVENTS_PUBLISHER:log}   # log = solo escribe en el log; rabbit = publica en RabbitMQ
  security:
    required-scope: ${REQUIRED_SCOPE:inventory.access}
    issuer-uri: ${JWT_ISSUER:}
    jwk-set-uri: ${JWT_JWK_SET_URI:}
    audience: ${JWT_AUDIENCE:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
