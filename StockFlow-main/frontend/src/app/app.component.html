<div class="app-layout">
  <header class="main-header">
    <div class="header-container">
      <a routerLink="/products" class="brand-logo">StockFlow</a>

      <nav class="nav-menu">
        <a routerLink="/products" routerLinkActive="active" class="nav-link">Productos</a>
        <a routerLink="/movements" routerLinkActive="active" class="nav-link">Movimientos</a>
        <a routerLink="/alerts" routerLinkActive="active" class="nav-link">Alertas</a>
      </nav>

      <div class="user-profile">
        <div class="avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="user-info">
          <span class="user-name">MATIAS NICOLAS MALDONADO MALDONADO</span>
        </div>
        <button type="button" class="btn-logout" (click)="logout()">
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
